{%- assign tree = site.data.research_maps[include.map] -%}
<div class="research-tree-scroll" tabindex="0" role="region" aria-label="{{ tree.title | escape }}; scroll horizontally to explore the full tree">
    <svg class="research-tree" viewBox="0 0 {{ tree.width }} {{ tree.height }}" role="group" aria-labelledby="{{ tree.id }}-title {{ tree.id }}-description">
        <title id="{{ tree.id }}-title">{{ tree.title | escape }}</title>
        <desc id="{{ tree.id }}-description">{{ tree.description | escape }}</desc>
        <defs>
            <marker id="{{ tree.id }}-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
                <path class="research-tree-arrow" d="M 0 0 L 10 4 L 0 8 L 2.5 4 Z" />
            </marker>
        </defs>
        {% for edge in tree.edges %}
        <path class="research-tree-edge" data-from="{{ edge.from }}" data-to="{{ edge.to }}" d="{{ edge.path }}" marker-end="url(#{{ tree.id }}-arrow)" />
        {% endfor %}
        {% for edge in tree.edges %}
        <text class="research-tree-edge-label" x="{{ edge.label_x }}" y="{{ edge.label_y }}" text-anchor="{{ edge.anchor | default: 'middle' }}">{{ edge.label | escape }}</text>
        {% endfor %}
        {% for node in tree.nodes %}
        {% assign center_x = node.width | divided_by: 2.0 | plus: node.x %}
        {% assign text_y = node.y | plus: 30 %}
        <g class="research-tree-node{% if node.core %} research-tree-node-core{% endif %}" data-node="{{ node.key | default: node.id }}">
            {% if node.key %}
            {% assign paper = site.data.research_references | where: "key", node.key | first %}
            {% for reference in site.data.research_references %}{% if reference.key == node.key %}{% assign reference_number = forloop.index %}{% break %}{% endif %}{% endfor %}
            <a href="{{ paper.url }}" aria-label="{{ paper.title | escape }}; reference {{ reference_number }}">
                <title>{{ paper.title | escape }}</title>
            {% endif %}
                <rect x="{{ node.x }}" y="{{ node.y }}" width="{{ node.width }}" height="{{ node.height }}" rx="4" />
                {% if node.date %}
                <text class="research-tree-date" x="{{ center_x }}" y="{{ node.y | plus: 23 }}" text-anchor="middle">{{ node.date }}</text>
                {% assign text_y = node.y | plus: 46 %}
                {% endif %}
                <text class="research-tree-node-title" text-anchor="middle">
                    {% for line in node.lines %}
                    {% assign line_y = forloop.index0 | times: 23 | plus: text_y %}
                    <tspan x="{{ center_x }}" y="{{ line_y }}">{{ line | escape }}{% if forloop.last and node.key %} [{{ reference_number }}]{% endif %}</tspan>
                    {% endfor %}
                </text>
            {% if node.key %}
            </a>
            {% endif %}
        </g>
        {% endfor %}
    </svg>
</div>
