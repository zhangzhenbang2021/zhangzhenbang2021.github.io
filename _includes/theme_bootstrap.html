<script>
    (function() {
        try {
            var storedTheme = localStorage.getItem("site-theme");
            var theme = storedTheme === "dark" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
            document.documentElement.setAttribute("data-theme", "light");
        }
    })();
</script>
