short_bio: >-
  <p>
    I am an M.Sc. student in Machine Learning at
    <a href="https://www.mbzuai.ac.ae/" target="_blank">Mohamed bin Zayed University of Artificial Intelligence (MBZUAI)</a>,
    advised by Prof. <a href="https://scholar.google.com/citations?user=0R20iBMAAAAJ&hl=en" target="_blank">Zhiqiang Xu</a>.
  </p>
  <p>
    My previous research has focused on diffusion-based generative modeling and 3D reconstruction of biological microscopy images.
    A recurring theme in my work is recovering reliable spatial and temporal structure from noisy, distorted, incomplete, or
    inconsistent visual observations by modeling visual degradation and developing reconstruction methods that preserve structure.
  </p>
  <p>
    My current research focuses on foundational questions in LLM and MLLM post-training, visual generative modeling,
    and reinforcement learning.
  </p>

