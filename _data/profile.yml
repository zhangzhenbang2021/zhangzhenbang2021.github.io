short_bio: >-
  <p>
    I am an M.Sc. student in Machine Learning at
    <a href="https://www.mbzuai.ac.ae/" target="_blank">Mohamed bin Zayed University of Artificial Intelligence (MBZUAI)</a>,
    advised by Prof. <a href="https://scholar.google.com/citations?user=0R20iBMAAAAJ&hl=en" target="_blank">Zhiqiang Xu</a>.
  </p>
  <p>
    My previous research has focused on diffusion-based generative modeling and 3D reconstruction of biological microscopy images.
    A recurring theme in my work is recovering reliable spatial and temporal structure from noisy, distorted, incomplete, or
    inconsistent visual observations by modeling visual degradation and developing reconstruction methods that preserve structure.
  </p>
  <p>
    My current research interests center on two directions. First, I study post-training for large language and multimodal language models (LLMs/MLLMs),
    with a focus on understanding how supervised fine-tuning (SFT) and reinforcement learning (RL) help foundation models
    acquire new capabilities while retaining prior knowledge and improving generalization. Second, I am interested in synthetic
    data generation for LLMs and image and video models. In particular, I explore how downstream learning feedback can guide
    synthetic data generation, including how to identify examples that are most beneficial to a learner at its current stage
    of training.
  </p>

